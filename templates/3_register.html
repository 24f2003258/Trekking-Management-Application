<!doctype html>
<html>
  <head>
    <title>Register</title>
    <style>
      body {
        background-image: url("/static/trek_2.png");
        opacity: 0.9;
      }
      #footer{
        background-color: black;
        color :antiquewhite
      }
      button{
        color :goldenrod;
        background-color:rgb(60, 5, 86);
      }
    </style>
    <link rel="stylesheet" href="/static/style_1.css" />
  </head>

  <body>
    <div class="outer_box">
      <div style="text-align: left">
        <img
          src="/static/logo_Trekking.png"
          alt="Trekking Management System Logo"
          style="width: 100px"
        />
      </div>
      <a href="/">Go To Home</a>

      <h2>User Registration</h2>

      <form action="#" method="POST">
        <label for="name">Name:</label>
        <input type="text" name="name" id="name" />
        <br /><br />

        <label>Email:</label>
        <input type="email" name="email" />
        <br /><br />

        <label>Password:</label>
        <input type="password" name="password" />
        <br /><br />

        <label for="phone">Phone :</label>
        <input type="tele" name="phone" id="phone" />
        <br /><br />

        <label for="role">Role </label>
        <select id="role" name="role">
          <option value="">--Select Role--</option>
          <option value="user">User</option>
          <option value="staff">Staff</option>
        </select>
        <button type="submit">Register</button>
      </form>
    </div>
    <div id ="footer">
       <p>IIT Madras BS Degree Project © TERM : MAY 2026</p>
    </div>
  </body>
</html>
