<!DOCTYPE html>
<html>
<head>
    <title>Manage Staff</title>
</head>
<body>
<div style ="text-align: left;">
    <img src="/static/logo_Trekking.png" alt="Trekking Management System Logo" style="width:100px;">
</div>
<h2>Manage Staff</h2>

<table border="1">

<tr>
    <th>Staff ID</th>
    <th>Name</th>
    <th>Status</th>
    <th>Is_Blocklisted</th>
</tr>
{% for Staff in Staff %}
<tr>
    <td>{{Staff.Id}}</td>
    <td>{{Staff.Name}}</td>
    <td>{{Staff.Pending}}</td>
    <td>
        <select name =" status">
            <option value ="blocklisted">Blocklisted</option>
            <option value = "unblocklisted">UnBlocklisted</option>
        </select>
    </td>
</tr>

</table>

</body>
</html>
