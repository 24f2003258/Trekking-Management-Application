<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings</title>

    <style>
        body{
            margin:0;
            font-family: Arial, sans-serif;
            background:#f4f4f4;
        }

        header{
            background:#2c3e50;
            color:white;
            padding:15px;
            text-align:center;
        }

        .container{
            width:90%;
            margin:20px auto;
        }

        .cards{
            display:flex;
            flex-wrap:wrap;
            gap:20px;
            justify-content:center;
        }

        .card{
            width:320px;
            background:white;
            border:1px solid #ccc;
            border-radius:8px;
            padding:15px;
            box-shadow:2px 2px 8px rgba(0,0,0,0.2);
        }

        .card h2{
            margin-top:0;
            color:#2c3e50;
        }

        .card p{
            margin:8px 0;
        }

        .status{
            font-weight:bold;
            color:green;
        }

        .cancel-btn{
            display:inline-block;
            margin-top:10px;
            padding:8px 15px;
            background:#d9534f;
            color:white;
            text-decoration:none;
            border-radius:4px;
        }

        .cancel-btn:hover{
            background:#c9302c;
        }

        .no-booking{
            text-align:center;
            margin-top:40px;
            font-size:20px;
            color:gray;
        }
    </style>

</head>
<body>

<header>
    <h1>Book Trek</h1>
</header>

<div class="container">


<div class="cards">
    <div class="card">
        
        <h2>Name : {{ booking.trek_name }}</h2>
        <p><strong>Location:</strong> {{ booking.location }}</p>
        <p><strong>Duration:</strong> {{ booking.duration }}</p>
        
        <p><strong>Price:</strong> ₹{{ booking.price }}</p>
        
        <p><strong>Start Date:</strong> {{ booking.start_date }}</p>
        
        <p><strong>No. of Seats:</strong> {{ booking.available_seat}}</p>
        
        <p><strong>Status:</strong>
            <span class="status">{{ booking.status }}</span>
        </p>
<form  action ="#" method ="POST">
        
    <lable for ="people"> No. Of Person : </label>
    <input type = "number" name = "people" id ="people">

    <button> Confirm Booking </button>  
</form > 
</div>


</div>



</div>

</body>
</html>
